name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --stacktrace

      - name: Pick the jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Using $JAR"

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-relic-jar
          path: ${{ steps.jar.outputs.path }}

      - name: Create next release (v1, v2, v3...)
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          COUNT=$(gh release list --limit 1000 --json tagName --jq 'length')
          TAG="v$((COUNT + 1))"
          while gh release view "$TAG" >/dev/null 2>&1; do
            COUNT=$((COUNT + 1))
            TAG="v$((COUNT + 1))"
          done
          {
            echo "NEW"
            echo "- See changes below"
            echo
            echo "FIXED"
            echo "- See changes below"
            echo
            echo "CHANGES"
            echo "- ${COMMIT_MSG:-Manual build}"
          } > notes.md
          gh release create "$TAG" "$JAR" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          echo "Released $TAG"
